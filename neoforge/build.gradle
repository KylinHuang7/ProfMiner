plugins {
    id "architectury-plugin"
    id "dev.architectury.loom"
    id "com.github.johnrengelman.shadow"
    id "net.darkhax.curseforgegradle"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    silentMojangMappingsLicense()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.property('minecraft_version')}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${rootProject.property('neoforge_version')}"

    modImplementation "dev.architectury:architectury-neoforge:${rootProject.property('architectury_version')}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
               "mod_id": rootProject.property("mod_id"),
               "mod_name": rootProject.property("mod_name"),
               "mod_authors": rootProject.property("mod_authors"),
               "mod_description": rootProject.property("mod_description"),
               "mod_license": rootProject.property("mod_license"),
               "minecraft_version_range": rootProject.property("minecraft_version_range"),
               "neo_version_range": rootProject.property("neo_version_range"),
               "loader_version_range": rootProject.property("loader_version_range")
    }
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// ============================================================
// CurseForge 发布配置
// ============================================================
if (System.getenv("CURSEFORGE_API_KEY") && System.getenv("CURSEFORGE_PROJECT_ID")) {
    task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        dependsOn remapJar
        disableVersionDetection()

        apiToken = System.getenv("CURSEFORGE_API_KEY")

        def mainFile = upload(System.getenv("CURSEFORGE_PROJECT_ID"), remapJar.archiveFile)
        mainFile.displayName = "ProfMiner ${rootProject.property('minecraft_version')} (NeoForge) v${project.version}"
        mainFile.releaseType = "release"
        mainFile.changelog = "v${project.version} 多版本支持更新。详见 GitHub CHANGELOG.md"
        mainFile.changelogType = "text"
        mainFile.addGameVersion(rootProject.property('minecraft_version'))
        mainFile.addModLoader("NeoForge")
    }
}
